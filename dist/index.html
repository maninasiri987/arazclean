  <body>
    <div id="root">
      <!-- لودر اولیه — انیمیشن ساده در مرکز صفحه (قبل از بارگذاری جاوااسکریپت) -->
      <div class="boot-screen" role="status" aria-label="در حال بارگذاری">
        <div class="boot-center">
          <div class="boot-spinner" aria-hidden="true"></div>
        </div>
      </div>
      <style>
        .boot-screen {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #ffffff;
        }
        .boot-center {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .boot-spinner {
          box-sizing: border-box;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 4px solid rgba(14, 165, 164, 0.15);
          border-top-color: #0ea5a4;
          animation: boot-spin 0.9s linear infinite;
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-spinner {
            animation: none;
          }
        }
      </style>
    </div>
  </body>
