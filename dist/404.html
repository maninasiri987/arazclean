<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>در حال انتقال…</title>
    <script>
      // مسیرهای ناشناخته در GitHub Pages → انتقال به خانهٔ SPA با حفظ مسیر به‌صورت hash
      (function () {
        var base = "/arazclean/";
        var segs = location.pathname.split("/").filter(Boolean);
        segs.shift(); // حذف نام مخزن (arazclean)
        var rest = segs.join("/");
        window.location.replace(base + "#/" + rest + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
